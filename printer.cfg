[include /home/pi/printer_data/config/custom/mcus/*]

# =====================
# CONSTANTS (static hardware values — single source of truth)
# =====================
[constants]
# Sensorless homing (tuning values, not motor-specific)
sensorless_x_home_current: 1.4
sensorless_y_home_current: 1.2
sensorless_y_sgt: 0

# Firmware retraction (used in [firmware_retraction], NOT the macro G1 retracts)
fw_retract_speed: 60
fw_unretract_speed: 60

# Bed mesh / z-tilt probe movement speed
mesh_tilt_speed: 500

# Filament
filament_diameter: 1.75

# TMC autotune bus voltages
xy_bus_voltage: 48
xy_overvoltage_vth: 56
z_bus_voltage: 24
e_bus_voltage: 24

# =====================
# _PRINTER_VARS (user-tunable settings only; everything else is derived)
# =====================
[gcode_macro _PRINTER_VARS]
variable_travel_speed: 400              # mm/s for XY travel during homing moves/parking
variable_travel_accel: 5000             # mm/s² for XY travel moves (SMART_PARK, parking, purge, etc.)
variable_z_travel_speed: 25             # mm/s for Z hops during homing/parking
variable_z_hop_height: 15.0             # mm Z lift at end of print / parking
variable_end_retract_length: 5.0        # mm retract at end of print
variable_retract_speed: 45              # mm/s retract speed

# Pause/standby behavior
variable_park_location: "front"          # options: front, center, rear. Place to park for pauses
variable_pause_standby_extruder_delta: 80 # °C drop from current hotend target on PAUSE
variable_pause_min_standby_temp: 150     # °C minimum standby temp (don't go below this)
variable_pause_idle_timeout: 14400       # seconds idle timeout when paused (default 4 hours)

# Beacon-only knobs (ignored if Beacon not configured)
variable_max_thermal_offset: 0.100      # mm max Z thermal offset

# Purge line fallback (only used if KAMP's LINE_PURGE doesn't exist)
variable_purge_line_length: 30           # mm total extrusion path length
variable_purge_speed: 10                 # mm/s purge move speed

# Chamber heating
variable_high_temp_threshold: 90         # °C bed temp threshold considered "high"
variable_chamber_assist_temp: 80         # °C bed temp at/above which we run assist fans to warm chamber
variable_default_chamber_target: 40      # °C default chamber target temp (used by PREHEAT + TA_CHAMBER_HEAT)
variable_chamber_start_delta: 3          # °C below chamber target at which mixing may stop; chamber keeps heating passively through the rest of PRINT_START
variable_standard_heat_soak_time: 0      # minutes (PLA/PETG/TPU, etc.)
variable_high_temp_heat_soak_time: 5     # minutes (ABS/ASA/PC/NYLON, etc.)
variable_default_chamber_assist_extruder_temp: 150 # °C extruder temp during chamber warmup

# Dynamic chamber heating / air-mix variables
variable_chamber_sensor_name: "chamber"  # name of your temperature_sensor section
variable_chamber_printhead_temp: 150     # °C nozzle temp during chamber warmup (Beacon-friendly)
variable_chamber_printhead_height: 15    # mm Z height to run air-mix pattern
variable_chamber_printhead_fan_speed: 0.5 # 0.0-1.0 part cooling fan speed during warmup
variable_chamber_move_speed_fast: 80     # mm/s for >=400mm beds
variable_chamber_move_speed_medium: 60   # mm/s for ~300mm beds
variable_chamber_move_speed_slow: 40     # mm/s for <=200mm beds

# Chamber fan names (set to empty string if that device doesn’t exist)
variable_chamber_fan: ""
variable_bed_fan: "chamber_heater_extra_fan"
variable_filter_fan: "filter"

# Material presets (used by PREHEAT + TOOLHEAD_ASSISTED_CHAMBER_HEATING)
variable_high_temp_materials: "ABS,ASA,PC,PC-CF,NYLON,PA,PA-CF,PA-GF,PET-CF"
variable_warp_prone_materials: "ABS,ASA,PC,PC-CF,NYLON,PA,PA-CF,PA-GF"
variable_default_material: "ASA"

# Park position offsets
variable_park_front_offset: 5              # mm from Y axis_min for front park
variable_park_rear_margin: 10              # mm inset from axis limits for rear park

# Purge line tuning
variable_purge_start_offset: 2             # mm from axis_min for purge start position
variable_purge_extrusion_ratio: 5.0        # extrude L/ratio (e.g. 5.0 = 20% of line length)

# Bed mesh check
variable_max_mesh_deviation: 0.200         # mm max mesh deviation before warning

# Cooldown sequence
variable_cooldown_step_wait: 15            # seconds to wait at each cooldown step
variable_cooldown_final_temp: 40           # °C final bed temp in stepped cooldown
variable_filter_quick_duration: 180        # seconds to run filter after quick cooldown
variable_filter_cooldown_duration: 300     # seconds to run filter after controlled cooldown
gcode:

[danger_options]
error_on_unused_config_options: False
endstop_sample_count: 2
multi_mcu_trsync_timeout: 0.05

[heater_bed]
#control: pid
heater_pin: heater_bed_heating_pin
sensor_pin: heater_bed_sensor_pin
sensor_type: Generic 3950
min_temp: 0
max_temp: 140
pwm_cycle_time: 0.02 # 50hz for european AC, to avoid flickering lights.
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114

[resonance_tester]
accel_chip_x: beacon
accel_chip_y: beacon
accel_per_hz: 150
sweeping_accel: 400
sweeping_period: 0


[include KAMP_Settings.cfg]

[include /home/pi/printer_data/config/custom/k3/k3.cfg]
[include /home/pi/printer_data/config/custom/extruders/sherpa_mini-8t.cfg]
[include /home/pi/printer_data/config/custom/hotends/chube-air.cfg]
[include /home/pi/printer_data/config/custom/probes/beacon.cfg]
[include /home/pi/printer_data/config/custom/fans/*]
[include /home/pi/printer_data/config/custom/sensors/*]
[include /home/pi/printer_data/config/custom/macros.cfg]
[include /home/pi/printer_data/config/custom/tuning/*]


[input_shaper]
enabled_extruders: extruder
shaper_type_x = zv
shaper_freq_x = 80.8
shaper_type_y = mzv
shaper_freq_y = 80.6
damping_ratio_x: 0.040 # damping ratio for the X axis
damping_ratio_y: 0.037 # damping ratio for the Y axis

