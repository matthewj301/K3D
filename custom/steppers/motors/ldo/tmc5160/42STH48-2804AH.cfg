[tmc5160 stepper_x]
cs_pin: x_uart_pin
spi_software_mosi_pin: stepper_spi_mosi_pin
spi_software_miso_pin: stepper_spi_miso_pin
spi_software_sclk_pin: stepper_spi_sclk_pin
run_current: 2.1
interpolate: True
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 stepper_x1]
cs_pin: x1_uart_pin
spi_software_mosi_pin: stepper_spi_mosi_pin
spi_software_miso_pin: stepper_spi_miso_pin
spi_software_sclk_pin: stepper_spi_sclk_pin
run_current: ${tmc5160 stepper_x.run_current}
interpolate: ${tmc5160 stepper_x.interpolate}
sense_resistor: ${tmc5160 stepper_x.sense_resistor}
stealthchop_threshold: ${tmc5160 stepper_x.stealthchop_threshold}

[tmc5160 stepper_y]
cs_pin: y_uart_pin
spi_software_mosi_pin: stepper_spi_mosi_pin
spi_software_miso_pin: stepper_spi_miso_pin
spi_software_sclk_pin: stepper_spi_sclk_pin
run_current: ${tmc5160 stepper_x.run_current}
interpolate: ${tmc5160 stepper_x.interpolate}
sense_resistor: ${tmc5160 stepper_x.sense_resistor}
stealthchop_threshold: ${tmc5160 stepper_x.stealthchop_threshold}

[tmc5160 stepper_y1]
cs_pin: y1_uart_pin
spi_software_mosi_pin: stepper_spi_mosi_pin
spi_software_miso_pin: stepper_spi_miso_pin
spi_software_sclk_pin: stepper_spi_sclk_pin
run_current: ${tmc5160 stepper_x.run_current}
interpolate: ${tmc5160 stepper_x.interpolate}
sense_resistor: ${tmc5160 stepper_x.sense_resistor}
stealthchop_threshold: ${tmc5160 stepper_x.stealthchop_threshold}
