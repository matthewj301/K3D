# =====================
# PRINT_START (Beacon-aware, KAMP-aware)
# =====================
[gcode_macro PRINT_START]
description: Start the print
gcode:
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !bed_temp = float(params.get("BED_TEMP", 0))
  !hotend_temp = float(params.get("HOTEND_TEMP", 0))
  !chamber_target_temp = float(params.get("TARGET_CHAMBER_TEMP", 0))
  !mat = params.get("MATERIAL", vars["default_material"])
  !emit("MAYBE_HOME")
  !emit("SYNC_MOTORS")
  !emit(f'SAVE_VARIABLE VARIABLE=current_material VALUE=\'"{mat}"\'')
  !emit("CLEAR_PAUSE")
  !emit("RESET_MULTIPLIERS")
  !emit("G90")
  !emit("BED_MESH_CLEAR")
  !emit("SET_GCODE_OFFSET Z=0")
  !has_beacon = "beacon" in printer["configfile"]["settings"]
  !if has_beacon:
  !  beacon_cal_temp = int(printer["gcode_macro BEACON_VARS"]["beacon_contact_calibration_temp"])
  !  emit(f'PREHEAT BED_TEMP={bed_temp} HOTEND_TEMP={beacon_cal_temp} MATERIAL="{mat}" QUICK=0 TARGET_CHAMBER_TEMP={chamber_target_temp}')
  !  emit("G28 Z METHOD=CONTACT CALIBRATE=1")
  !else:
  !  emit("G28 Z")
  !  emit(f'PREHEAT BED_TEMP={bed_temp} HOTEND_TEMP={hotend_temp} MATERIAL="{mat}" QUICK=0 TARGET_CHAMBER_TEMP={chamber_target_temp}')
  !if "quad_gantry_level" in printer["configfile"]["settings"]:
  !  emit("QUAD_GANTRY_LEVEL")
  !elif "z_tilt" in printer["configfile"]["settings"] or "z_tilt_ng" in printer["configfile"]["settings"]:
  !  emit("Z_TILT_ADJUST")
  !else:
  !  emit('RESPOND MSG="No gantry leveling module detected - skipping."')
  !if has_beacon:
  !  # Wipe the nozzle and take the authoritative Z=0 home BEFORE meshing.
  !  # WIPE_NOZZLE contact-probes at the front of the bed (Y=3), which is
  !  # outside the mesh region (mesh_min Y=30). If a mesh were active, the
  !  # extrapolated edge compensation would shift the nozzle's start height
  !  # and the contact move would bottom out before touching the bed
  !  # ("No trigger on probe after full movement"). The gantry is already
  !  # level (Z_TILT_ADJUST ran); this contact home sets the Z=0 that
  !  # first-layer height depends on, so the nozzle must be clean.
  !  emit("WIPE_NOZZLE")
  !  emit("G28 Z METHOD=CONTACT CALIBRATE=0")
  !if "bed_mesh" in printer["configfile"]["settings"]:
  !  # Mesh last, anchored to the clean contact Z=0 via zero_reference_position.
  !  emit('RESPOND MSG="Starting bed mesh calibration..."')
  !  emit("BED_MESH_CALIBRATE ADAPTIVE=1")
  !  emit(f"BED_MESH_CHECK MAX_DEVIATION={vars['max_mesh_deviation']}")
  !if has_beacon:
  !  emit(f"M104 S{hotend_temp}")
  !emit(f'SET_DISPLAY_TEXT MSG="Heating hotend to {hotend_temp}c"')
  !if "SMART_PARK" in printer["gcode"]["commands"]:
  !  emit("SMART_PARK")
  !else:
  !  emit("PICK_PARK_LOCATION")
  !extruder_cfg = printer["configfile"]["settings"].get("extruder", {})
  !if extruder_cfg.get("control", "") == "mpc":
  !  emit(f'_SET_MPC_MATERIAL MATERIAL="{mat}"')
  !emit(f"M109 S{hotend_temp}")
  !if "_BEACON_SET_NOZZLE_TEMP_OFFSET" in printer["gcode"]["commands"]:
  !  emit('RESPOND MSG="Setting Beacon thermal expansion compensation"')
  !  emit("_BEACON_SET_NOZZLE_TEMP_OFFSET")
  !if "LINE_PURGE" in printer["gcode"]["commands"]:
  !  emit('RESPOND MSG="Starting line purge..."')
  !  emit("LINE_PURGE")
  !else:
  !  emit('RESPOND MSG="Starting fallback line purge..."')
  !  emit(f"_FALLBACK_PURGE LENGTH={vars['purge_line_length']} SPEED={vars['purge_speed']}")
  !emit("MAYBE_LOAD_SKEW_CORRECTION")
  !emit('RESPOND MSG="Starting Print..."')
  !emit("SAVE_VARIABLE VARIABLE=is_printing_gcode VALUE=True")
  !emit("G90")

# =====================
# PRINT_END
# =====================
[gcode_macro PRINT_END]
description: Consistent end-of-print routine. reason codes: 0 = cancelled, 1 = completed
gcode:
  !reason = params.get("REASON", "complete").lower()
  !reason_code = 1 if reason == "complete" else 0
  !emit(f'RESPOND MSG="Passed reason: {reason}, code: {reason_code}"')
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !retract_speed = int(float(vars["retract_speed"]) * 60)
  !retract_length = float(vars["end_retract_length"])
  !emit("M400")
  !emit("TURN_PART_COOLING_FAN_OFF")
  !emit("G92 E0")
  !if printer["extruder"]["can_extrude"]:
  !  emit("G91")
  !  emit(f"G1 E-{retract_length} F{retract_speed}")
  !  emit("G90")
  !emit("PICK_PARK_LOCATION")
  !if "beacon" in printer["configfile"]["settings"]:
  !  emit("_BEACON_REMOVE_NOZZLE_TEMP_OFFSET")
  !if "bed_mesh" in printer["configfile"]["settings"]:
  !  emit("BED_MESH_CLEAR")
  !emit(f"COOLDOWN_SEQUENCE QUICK={reason_code}")
  !emit("DISABLE_ALL_MOTORS")
  !emit("RESET_TO_START_STATE")

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
  !if printer["pause_resume"]["is_paused"]:
  !  respond_info("Already paused...")
  !  RETURN
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !retract_speed = int(float(vars["retract_speed"]) * 60)
  !retract_length = float(vars["end_retract_length"])
  !set_gcode_variable("RESUME", "printing_target_temp", printer["extruder"]["target"])
  !emit("SAVE_GCODE_STATE NAME=PAUSE")
  !emit("PAUSE_BASE")
  !if printer["extruder"]["can_extrude"]:
  !  emit("G91")
  !  emit(f"G1 E-{retract_length} F{retract_speed}")
  !  emit("G90")
  !emit("TURN_PART_COOLING_FAN_OFF")
  !emit("PICK_PARK_LOCATION")
  !emit("SAVE_GCODE_STATE NAME=PAUSEPARK")
  !emit("M104 S0")
  !emit('RESPOND MSG="Hotend turned off."')
  !emit(f"SET_IDLE_TIMEOUT TIMEOUT={vars['pause_idle_timeout']}")
  !emit(f'RESPOND MSG="Setting idle timeout to {vars["pause_idle_timeout"]} seconds."')

[gcode_macro RESUME]
rename_existing: RESUME_BASE
variable_printing_target_temp: 0
gcode:
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !return_speed = float(vars["travel_speed"]) / 2
  !retract_speed = int(float(vars["retract_speed"]) * 60)
  !retract_length = float(vars["end_retract_length"])
  !emit(f"RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED={return_speed}")
  !if own_vars.printing_target_temp > 0:
  !  emit(f'RESPOND MSG="Resuming: heating hotend to {own_vars.printing_target_temp}C"')
  !  emit(f"M109 S{own_vars.printing_target_temp}")
  !if printer["extruder"]["can_extrude"]:
  !  emit("G91")
  !  emit(f"G1 E{retract_length} F{retract_speed}")
  !  emit("G90")
  !emit(f"RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED={return_speed}")
  !if "_BEACON_SET_NOZZLE_TEMP_OFFSET" in printer["gcode"]["commands"]:
  !  emit("_BEACON_SET_NOZZLE_TEMP_OFFSET")
  !emit("RESUME_BASE")

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
  CLEAR_PAUSE
  PRINT_END REASON=cancel
  BASE_CANCEL_PRINT

[gcode_macro M600]
gcode:
  PAUSE

[gcode_macro _SET_MPC_MATERIAL]
gcode:
  !material = params.get("MATERIAL", "ASA").upper()
  !density_map = {
  !  "PLA": 1.24, "ABS": 1.04, "ASA": 1.07,
  !  "PETG": 1.27, "PET-CF": 1.35,
  !  "PC": 1.20, "PC-CF": 1.30,
  !  "PA": 1.14, "NYLON": 1.14, "PA-CF": 1.30, "PA-GF": 1.40,
  !  "TPU": 1.21,
  !}
  !capacity_map = {
  !  "PLA": 1.80, "ABS": 2.00, "ASA": 1.30,
  !  "PETG": 1.17, "PET-CF": 1.10,
  !  "PC": 1.15, "PC-CF": 1.10,
  !  "PA": 1.70, "NYLON": 1.70, "PA-CF": 1.50, "PA-GF": 1.40,
  !  "TPU": 1.50,
  !}
  !density = density_map.get(material, 1.20)
  !capacity = capacity_map.get(material, 1.50)
  !emit(f'RESPOND MSG="MPC: setting {material} properties (density={density}, capacity={capacity})"')
  !emit(f"MPC_SET HEATER=extruder FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={capacity}")
