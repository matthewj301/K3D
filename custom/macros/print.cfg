# Startup yields during preheat; virtual SD is held until continuation succeeds.
[gcode_macro PRINT_START]
description: Validate, prepare, and start interruptible preheat
gcode: !!include python/print_start.py

[gcode_macro _PRINT_START_STATE]
variable_active: False
variable_sd_paused: False
variable_filename: ''
variable_params: {}
gcode:

# =====================
# PRINT_START (Beacon-aware, KAMP-aware, no hard-coded units)
# =====================
[gcode_macro _PRINT_START_BEGIN]
gcode: !!include python/start_begin.py

[gcode_macro _PRINT_START_AFTER_PREHEAT]
gcode: !!include python/start_after_preheat.py

# =====================
# PRINT_END
# =====================
[gcode_macro PRINT_END]
description: Consistent end-of-print routine. reason codes: 0 = cancelled, 1 = completed
gcode:
  !reason = params.get("REASON", "complete").lower()
  !if reason not in ("complete", "cancel"):
  !  raise_error(f"PRINT_END: REASON must be 'complete' or 'cancel' (got '{reason}').")
  !reason_code = 1 if reason == "complete" else 0
  !emit(f'RESPOND MSG="Passed reason: {reason}, code: {reason_code}"')
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !retract_speed = int(float(vars["retract_speed"]) * 60)
  !retract_length = float(vars["end_retract_length"])
  !emit("M400")
  !emit("TURN_PART_COOLING_FAN_OFF")
  !emit("G92 E0")
  !if printer["extruder"]["can_extrude"]:
  !  emit("G91")
  !  emit(f"G1 E-{retract_length} F{retract_speed}")
  !  emit("G90")
  !emit("_CLEAR_PRINT_SKEW")
  !emit("PICK_PARK_LOCATION")
  !if "beacon" in printer["configfile"]["settings"]:
  !  emit("_BEACON_REMOVE_NOZZLE_TEMP_OFFSET")
  !if "bed_mesh" in printer["configfile"]["settings"]:
  !  emit("BED_MESH_CLEAR")
  !emit(f"COOLDOWN_SEQUENCE QUICK={reason_code}")
  !# Disable motors only on cancel; a completed print keeps them energized so a
  !# back-to-back print can skip SYNC_MOTORS. idle_timeout releases them when idle.
  !if reason == "cancel":
  !  emit("DISABLE_ALL_MOTORS")
  !emit("RESET_TO_START_STATE")

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode: !!include python/pause.py

[gcode_macro RESUME]
rename_existing: RESUME_BASE
variable_printing_target_temp: 0
variable_retracted_length: 0
gcode: !!include python/resume.py

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel print
gcode:
    # Mandatory cancellation is independent of parking, homing and optional hardware.
    TURN_OFF_HEATERS_BASE
    BASE_CANCEL_PRINT
    _TA_CHAMBER_RESET
    M107
    M84
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=printing_target_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted_length VALUE=0
    _CLEAR_PRINT_SKEW
    RESET_TO_START_STATE
    {% if "bed_mesh" in printer.configfile.settings %}
        BED_MESH_CLEAR
    {% endif %}
    {% if printer.configfile.config["gcode_macro _BEACON_REMOVE_NOZZLE_TEMP_OFFSET"] is defined %}
        _BEACON_REMOVE_NOZZLE_TEMP_OFFSET
    {% endif %}
    {% if printer.mmu is defined and printer.mmu.enabled %}
        MMU_TTG_MAP RESET=1 QUIET=1
    {% endif %}
    COOLDOWN_SEQUENCE QUICK=0
    {% if "CASE_LIGHTS_OFF" in printer.gcode.commands %} CASE_LIGHTS_OFF {% endif %}
    RESPOND MSG="Print cancelled; heaters and motors off."

[gcode_macro M600]
gcode:
  PAUSE

[gcode_macro _SET_MPC_MATERIAL]
gcode:
  !material = params.get("MATERIAL", "ASA").upper()
  !density_map = {
  !  "PLA": 1.24, "ABS": 1.04, "ASA": 1.07,
  !  "PETG": 1.27, "PET-CF": 1.35,
  !  "PC": 1.20, "PC-CF": 1.30,
  !  "PA": 1.14, "NYLON": 1.14, "PA-CF": 1.30, "PA-GF": 1.40,
  !  "TPU": 1.21,
  !}
  !capacity_map = {
  !  "PLA": 1.80, "ABS": 2.00, "ASA": 1.30,
  !  "PETG": 1.17, "PET-CF": 1.10,
  !  "PC": 1.15, "PC-CF": 1.10,
  !  "PA": 1.70, "NYLON": 1.70, "PA-CF": 1.50, "PA-GF": 1.40,
  !  "TPU": 1.50,
  !}
  !density = density_map.get(material, 1.20)
  !capacity = capacity_map.get(material, 1.50)
  !emit(f'RESPOND MSG="MPC: setting {material} properties (density={density}, capacity={capacity})"')
  !emit(f"MPC_SET HEATER=extruder FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={capacity}")
