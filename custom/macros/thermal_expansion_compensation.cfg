[gcode_macro BEACON_VARS]
variable_beacon_contact_calibration_temp: 150
variable_beacon_contact_expansion_compensation: True
variable_beacon_contact_expansion_multiplier: 1.02
variable_adaptive_mesh: False
gcode:

[delayed_gcode _BEACON_INIT]
initial_duration: 0.1
gcode:
    _BEACON_SET_NOZZLE_TEMP_OFFSET RESET=True

[gcode_macro BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET]
variable_reference_z: 0.0
gcode:
  !z_speed = int(float(printer["configfile"]["settings"]["stepper_z"]["homing_speed"]) * 60)
  !z_hop = float(printer["configfile"]["settings"]["beacon"].get("home_z_hop", 10))
  !safe_home_x = float(printer["configfile"]["settings"]["stepper_x"]["position_max"]) / 2
  !safe_home_y = float(printer["configfile"]["settings"]["stepper_y"]["position_max"]) / 2
  !if printer["toolhead"]["homed_axes"] != "xyz":
  !  emit("G28")
  !if "quad_gantry_level" in printer and not printer["quad_gantry_level"]["applied"]:
  !  emit('SET_DISPLAY_TEXT MSG="QGL"')
  !  if "gcode_macro fast_qgl" in printer["configfile"]["settings"]:
  !    if printer["configfile"]["settings"]["beacon"].get("default_probe_method") != "contact":
  !      emit("FAST_QGL")
  !  else:
  !    emit("QUAD_GANTRY_LEVEL")
  !  emit("G28 Z")
  !if "z_tilt_ng" in printer and not printer["z_tilt_ng"]["applied"]:
  !  emit('SET_DISPLAY_TEXT MSG="Z-Tilt adjust"')
  !  if "gcode_macro fast_z_tilt" in printer["configfile"]["settings"]:
  !    if printer["configfile"]["settings"]["beacon"].get("default_probe_method") != "contact":
  !      emit("FAST_Z_TILT")
  !  else:
  !    emit("Z_TILT_ADJUST")
  !  emit("G28 Z")
  !for i in range(10):
  !  emit("BEACON_POKE SPEED=3 TOP=5 BOTTOM=-0.6")
  !cal_temp = int(printer["gcode_macro BEACON_VARS"]["beacon_contact_calibration_temp"])
  !for temp in [cal_temp, 250]:
  !  emit(f"_BEACON_PROBE_NOZZLE_TEMP_OFFSET TEMP={temp}")
  !  emit(f"_BEACON_STORE_NOZZLE_TEMP_OFFSET TEMP={temp}")
  !emit(f"G0 Z{z_hop} F{z_speed}")
  !emit(f"G0 X{safe_home_x} Y{safe_home_y}")
  !emit("SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0")
  !emit("_BEACON_NOZZLE_TEMP_OFFSET")

[gcode_macro _BEACON_PROBE_NOZZLE_TEMP_OFFSET]
gcode:
  !temp = int(params["TEMP"])
  !z_speed = int(float(printer["configfile"]["settings"]["stepper_z"]["homing_speed"]) * 60)
  !emit(f'RESPOND MSG="Waiting for nozzle to reach {temp}C..."')
  !emit(f"SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}")
  !emit(f"TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp} MAXIMUM={temp + 2}")
  !emit('RESPOND MSG="Waiting 60s for thermal expansion..."')
  !emit("G4 P60000")
  !emit(f'RESPOND MSG="Probing with nozzle temperature {temp}C..."')
  !emit("PROBE PROBE_METHOD=contact SAMPLES=5 SAMPLES_TOLERANCE=0.005 SAMPLES_TOLERANCE_RETRIES=10 SAMPLES_RESULT=median")
  !emit("G4 P2000")
  !emit("BEACON_QUERY")
  !emit(f"G0 Z5 F{z_speed}")

[gcode_macro _BEACON_SET_NOZZLE_TEMP_OFFSET]
gcode:
  !reset = str(params.get("RESET", "false")).lower() == "true"
  !z_speed = int(float(printer["configfile"]["settings"]["stepper_z"]["homing_speed"]) * 60)
  !multiplier = float(printer["gcode_macro BEACON_VARS"]["beacon_contact_expansion_multiplier"])
  !compensation_enabled = bool(printer["gcode_macro BEACON_VARS"]["beacon_contact_expansion_compensation"])
  !cal_temp = int(params.get("PROBING_TEMP", 150))
  !svv = printer["save_variables"]["variables"]
  !if reset:
  !  emit("SAVE_VARIABLE VARIABLE=nozzle_expansion_applied_offset VALUE=0")
  !elif compensation_enabled:
  !  coefficient = float(svv.get("nozzle_expansion_coefficient", 0))
  !  applied_offset = float(svv.get("nozzle_expansion_applied_offset", 0))
  !  temp = float(printer["extruder"]["target"])
  !  temp_offset = temp - cal_temp
  !  expansion_offset = multiplier * (temp_offset * (coefficient / 100))
  !  max_offset = float(printer["gcode_macro _PRINTER_VARS"]["max_thermal_offset"])
  !  if abs(expansion_offset) > max_offset:
  !    emit(f'RESPOND TYPE=error MSG="Thermal offset {expansion_offset:.4f}mm exceeds limit — clamping to {max_offset:.4f}mm"')
  !    expansion_offset = max_offset if expansion_offset > 0 else -max_offset
  !  new_offset = (-applied_offset) + expansion_offset
  !  emit(f"SET_GCODE_OFFSET Z_ADJUST={new_offset} MOVE=1 SPEED={z_speed}")
  !  emit(f"SAVE_VARIABLE VARIABLE=nozzle_expansion_applied_offset VALUE={expansion_offset}")
  !  emit(f'RESPOND MSG="Nozzle expansion offset of {expansion_offset:.6f}mm applied"')

[gcode_macro _BEACON_REMOVE_NOZZLE_TEMP_OFFSET]
gcode:
  !z_speed = int(float(printer["configfile"]["settings"]["stepper_z"]["homing_speed"]) * 60)
  !compensation_enabled = bool(printer["gcode_macro BEACON_VARS"]["beacon_contact_expansion_compensation"])
  !if compensation_enabled:
  !  svv = printer["save_variables"]["variables"]
  !  applied_offset = float(svv.get("nozzle_expansion_applied_offset", 0))
  !  emit(f"SET_GCODE_OFFSET Z_ADJUST={-applied_offset} MOVE=0 SPEED={z_speed}")
  !  emit("SAVE_VARIABLE VARIABLE=nozzle_expansion_applied_offset VALUE=0")

[gcode_macro _BEACON_STORE_NOZZLE_TEMP_OFFSET]
gcode:
  !temp = int(params["TEMP"])
  !last_z = float(printer["beacon"]["last_z_result"])
  !cal_temp = int(printer["gcode_macro BEACON_VARS"]["beacon_contact_calibration_temp"])
  !if temp == cal_temp:
  !  set_gcode_variable("BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET", "reference_z", last_z)
  !else:
  !  reference_z = float(printer["gcode_macro BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET"]["reference_z"])
  !  emit(f"SAVE_VARIABLE VARIABLE=nozzle_expansion_coefficient VALUE={last_z - reference_z}")

[gcode_macro _BEACON_NOZZLE_TEMP_OFFSET]
gcode:
  !svv = printer["save_variables"]["variables"]
  !coefficient = float(svv.get("nozzle_expansion_coefficient", 0))
  !respond_info(f"expansion coefficient {coefficient:.6f}")

