[gcode_macro _WIPE_NOZZLE_REPORT_OFFSET]
description: Internal — read offset-compare result and finalize
gcode:
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !z_speed = int(float(vars["z_travel_speed"]) * 60)
  !offset = printer["beacon"]["last_offset_result"]
  !if offset is None:
  !    emit('RESPOND TYPE=error MSG="WIPE_NOZZLE: BEACON_OFFSET_COMPARE did not produce a result"')
