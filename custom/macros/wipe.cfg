# =====================================================================
# WIPE_NOZZLE — iterative converging bed wipe for Beacon contact homing
# =====================================================================
# Background:
#   Beacon contact homing fires when the strain gauge detects the nozzle
#   being decelerated by the bed.  "Decelerated" includes being decelerated
#   by ooze stuck on the nozzle tip touching the bed before the actual
#   nozzle does.  Result: stored Z=0 is high by ~the booger thickness,
#   first layer doesn't stick.
#
#   This macro cleans the nozzle by repeatedly probing → wiping at
#   (probed_z + WIPE_HEIGHT) → re-probing, until successive probes
#   agree to within CONVERGENCE_THRESHOLD.  Each iteration's wipe is
#   automatically closer to the real bed surface as ooze is removed,
#   so the wipe naturally tightens up without ever risking a crash.
#
# Quality signal:
#   - Beacon's PROBE PROBE_METHOD=contact already enforces an internal
#     sample-spread tolerance (SAMPLES_TOLERANCE_RETRIES) — a probe that
#     errors out means the strain gauge is reading inconsistent triggers
#     (a hallmark of a soft/oozy contact).
#   - Successive probe-result convergence is our outer-loop signal.
#   - Optional final BEACON_OFFSET_COMPARE compares contact vs proximity
#     for an absolute contamination measure.
#
# Why split into multiple macros:
#   Kalico Python `!` blocks evaluate at the time the macro is invoked.
#   `emit(PROBE)` queues the probe for later execution — the same macro
#   that issued it cannot read its result.  So the loop is structured as
#   alternating PROBE/EVAL/WIPE macros that re-enter via emit().  Each
#   entry sees the printer state after the previously-queued commands
#   have run.

[gcode_macro WIPE_NOZZLE]
description: Iterative converging nozzle wipe for Beacon contact homing
# Usage:
#   WIPE_NOZZLE                                    # defaults
#   WIPE_NOZZLE MAX_ITERATIONS=2                   # bounded, fast
#   WIPE_NOZZLE VERIFY_WITH_OFFSET_COMPARE=1       # final contact-vs-proximity check
#   WIPE_NOZZLE Y=3 X_START=40 X_END=140            # custom path (default: front of bed)
gcode:
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !z_speed = int(float(vars["z_travel_speed"]) * 60)
  !travel  = int(float(vars["travel_speed"]) * 60)
  !# --- params with safe defaults in front of the K3D bed, outside the mesh region ---
  !wipe_y          = float(params.get("Y", 3))                 # front of bed, well clear of mesh (30,30)-(140,140)
  !wipe_x_start    = float(params.get("X_START", 40))
  !wipe_x_end      = float(params.get("X_END", 140))
  !wipe_height     = float(params.get("WIPE_HEIGHT", 0.1))     # mm above probed bed
  !max_iters       = int(params.get("MAX_ITERATIONS", 4))
  !conv_thresh     = float(params.get("CONVERGENCE_THRESHOLD", 0.02))
  !passes          = int(params.get("PASSES_PER_ITER", 2))
  !probe_samples   = int(params.get("PROBE_SAMPLES", 3))
  !probe_tol       = float(params.get("PROBE_TOLERANCE", 0.05))  # loose — we expect dirty probes on early iters
  !verify          = int(params.get("VERIFY_WITH_OFFSET_COMPARE", 0))
  !slide_speed     = int(float(params.get("SLIDE_SPEED_MM_S", 10)) * 60)
  !# --- guards ---
  !if "beacon" not in printer["configfile"]["settings"]:
  !    raise printer.command_error("WIPE_NOZZLE: requires Beacon probe — not configured")
  !if "xyz" not in printer["toolhead"]["homed_axes"]:
  !    raise printer.command_error("WIPE_NOZZLE: XYZ must be homed first (current homed_axes: %s)" % printer["toolhead"]["homed_axes"])
  !# Guard against positions outside physical bed travel (with 1mm safety margin).
  !# Intentionally allows positions outside the mesh — wiping in front of the mesh is preferred.
  !ax = printer["toolhead"]
  !x_lo = ax["axis_minimum"][0] + 1.0
  !x_hi = ax["axis_maximum"][0] - 1.0
  !y_lo = ax["axis_minimum"][1] + 1.0
  !y_hi = ax["axis_maximum"][1] - 1.0
  !for v, name, lo, hi in [
  !    (wipe_y,       "Y",        y_lo, y_hi),
  !    (wipe_x_start, "X_START",  x_lo, x_hi),
  !    (wipe_x_end,   "X_END",    x_lo, x_hi),
  !]:
  !    if not (lo <= v <= hi):
  !        raise printer.command_error("WIPE_NOZZLE: %s=%.2f outside safe bed travel [%.1f, %.1f]" % (name, v, lo, hi))
  !if wipe_x_start == wipe_x_end:
  !    raise printer.command_error("WIPE_NOZZLE: X_START == X_END, nothing to wipe")
  !# --- seed state holder and dispatch ---
  !emit("SAVE_GCODE_STATE NAME=STATE_WIPE_NOZZLE")
  !emit("G90")
  !emit("SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=iter VALUE=0")
  !emit("SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=prev_z VALUE=999.0")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=wipe_y VALUE={wipe_y}")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=wipe_x_start VALUE={wipe_x_start}")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=wipe_x_end VALUE={wipe_x_end}")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=wipe_height VALUE={wipe_height}")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=max_iters VALUE={max_iters}")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=conv_thresh VALUE={conv_thresh}")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=passes VALUE={passes}")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=probe_samples VALUE={probe_samples}")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=probe_tol VALUE={probe_tol}")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=verify VALUE={verify}")
  !emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=slide_speed VALUE={slide_speed}")
  !# --- move into position over the wipe path start ---
  !emit(f"G0 Z5 F{z_speed}")
  !emit(f"G0 X{wipe_x_start} Y{wipe_y} F{travel}")
  !emit('RESPOND MSG="WIPE_NOZZLE: starting iterative wipe at X=%.2f Y=%.2f"' % (wipe_x_start, wipe_y))
  !emit("_WIPE_NOZZLE_PROBE")


[gcode_macro _WIPE_NOZZLE_STATE]
# State holder — all variables set by WIPE_NOZZLE before dispatch.
variable_iter: 0
variable_prev_z: 999.0
variable_wipe_y: 3.0
variable_wipe_x_start: 40.0
variable_wipe_x_end: 140.0
variable_wipe_height: 0.1
variable_max_iters: 4
variable_conv_thresh: 0.02
variable_passes: 2
variable_probe_samples: 3
variable_probe_tol: 0.05
variable_verify: 0
variable_slide_speed: 600
gcode:
  # No-op — state holder only.


[gcode_macro _WIPE_NOZZLE_PROBE]
description: Internal — one probe + dispatch to evaluator
gcode:
  !s = printer["gcode_macro _WIPE_NOZZLE_STATE"]
  !samples = int(s["probe_samples"])
  !tol     = float(s["probe_tol"])
  !# Loose tolerance so a dirty probe doesn't hard-error out of the loop.
  !# Retries=2 lets internal sample-spread issues self-correct before we
  !# decide it's a real contamination problem.
  !emit(f"PROBE PROBE_METHOD=contact SAMPLES={samples} SAMPLES_TOLERANCE={tol} SAMPLES_TOLERANCE_RETRIES=2 SAMPLES_RESULT=median")
  !emit("_WIPE_NOZZLE_EVAL")


[gcode_macro _WIPE_NOZZLE_EVAL]
description: Internal — read last probe result, decide converge/wipe/abort
gcode:
  !s = printer["gcode_macro _WIPE_NOZZLE_STATE"]
  !iter        = int(s["iter"])
  !prev_z      = float(s["prev_z"])
  !max_iters   = int(s["max_iters"])
  !conv_thresh = float(s["conv_thresh"])
  !# --- read the freshly-queried Beacon state ---
  !if printer["beacon"]["last_probe_result"] != "ok":
  !    emit('RESPOND TYPE=error MSG="WIPE_NOZZLE: probe failed (last_probe_result=%s) — aborting wipe loop"' % printer["beacon"]["last_probe_result"])
  !    emit("_WIPE_NOZZLE_FINISH")
  !else:
  !    z_now = float(printer["beacon"]["last_z_result"])
  !    is_first = (iter == 0)
  !    delta = None if is_first else abs(prev_z - z_now)
  !    msg = "WIPE_NOZZLE iter %d/%d: z=%.4f" % (iter + 1, max_iters, z_now)
  !    if delta is not None:
  !        msg += " delta=%.4f" % delta
  !    emit('RESPOND MSG="%s"' % msg)
  !    converged = (delta is not None) and (delta < conv_thresh)
  !    # Can only terminate on last_iter when delta exists (at least one wipe done).
  !    # This guarantees MAX_ITERATIONS=1 still performs one wipe before finishing.
  !    last_iter = (iter + 1 >= max_iters) and (delta is not None)
  !    if converged:
  !        emit('RESPOND MSG="WIPE_NOZZLE: CONVERGED — nozzle clean (delta %.4f < %.4f mm)"' % (delta, conv_thresh))
  !        emit("_WIPE_NOZZLE_FINISH")
  !    elif last_iter:
  !        # Final iteration — could be still-dirty or could just be slow convergence.
  !        # Don't error: the calling PRINT_START will follow with its own contact home
  !        # which has stricter tolerances; if THAT errors the print won't proceed.
  !        emit('RESPOND MSG="WIPE_NOZZLE: hit max iterations (%d) — final z=%.4f delta=%.4f (>= threshold %.4f)"' % (max_iters, z_now, delta, conv_thresh))
  !        emit("_WIPE_NOZZLE_FINISH")
  !    else:
  !        # Update state, dispatch wipe with current probed Z as reference.
  !        emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=prev_z VALUE={z_now}")
  !        emit(f"SET_GCODE_VARIABLE MACRO=_WIPE_NOZZLE_STATE VARIABLE=iter VALUE={iter + 1}")
  !        emit(f"_WIPE_NOZZLE_WIPE Z_BASE={z_now}")


[gcode_macro _WIPE_NOZZLE_WIPE]
description: Internal — slide nozzle at (Z_BASE + wipe_height) for N passes
gcode:
  !s = printer["gcode_macro _WIPE_NOZZLE_STATE"]
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !z_base       = float(params["Z_BASE"])
  !wipe_height  = float(s["wipe_height"])
  !wipe_x_start = float(s["wipe_x_start"])
  !wipe_x_end   = float(s["wipe_x_end"])
  !wipe_y       = float(s["wipe_y"])
  !passes       = int(s["passes"])
  !z_speed      = int(float(vars["z_travel_speed"]) * 60)
  !travel       = int(float(vars["travel_speed"]) * 60)
  !slide_speed  = int(s["slide_speed"])
  !wipe_z = z_base + wipe_height
  !# Lift safely clear of bed first, reposition over wipe-start, drop to wipe height.
  !emit(f"G0 Z{z_base + 1.0:.4f} F{z_speed}")
  !emit(f"G0 X{wipe_x_start} Y{wipe_y} F{travel}")
  !emit(f"G0 Z{wipe_z:.4f} F{z_speed}")
  !# Back-and-forth slide.  Single pass = X_START → X_END → X_START.
  !for _ in range(passes):
  !    emit(f"G0 X{wipe_x_end:.4f} F{slide_speed}")
  !    emit(f"G0 X{wipe_x_start:.4f} F{slide_speed}")
  !# Lift clear of bed before next probe.
  !emit(f"G0 Z{z_base + 5.0:.4f} F{z_speed}")
  !emit("_WIPE_NOZZLE_PROBE")


[gcode_macro _WIPE_NOZZLE_FINISH]
description: Internal — optional offset-compare verification then exit
gcode:
  !s = printer["gcode_macro _WIPE_NOZZLE_STATE"]
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !verify   = int(s["verify"])
  !z_speed  = int(float(vars["z_travel_speed"]) * 60)
  !if verify == 1:
  !    # BEACON_OFFSET_COMPARE measures contact-z vs proximity-z at current XY.
  !    # On a clean nozzle the delta should be small (typically <50 microns,
  !    # depending on bed material).  A large positive delta means the nozzle
  !    # is still taller than the bed surface → still contaminated.
  !    emit('RESPOND MSG="WIPE_NOZZLE: running BEACON_OFFSET_COMPARE for absolute validation"')
  !    emit("BEACON_OFFSET_COMPARE")
  !    emit("_WIPE_NOZZLE_REPORT_OFFSET")
  !else:
  !    emit(f"G0 Z5 F{z_speed}")
  !    emit("RESTORE_GCODE_STATE NAME=STATE_WIPE_NOZZLE MOVE=0")


[gcode_macro _WIPE_NOZZLE_REPORT_OFFSET]
description: Internal — read offset-compare result and finalize
gcode:
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !z_speed = int(float(vars["z_travel_speed"]) * 60)
  !offset = printer["beacon"]["last_offset_result"]
  !if offset is None:
  !    emit('RESPOND TYPE=error MSG="WIPE_NOZZLE: BEACON_OFFSET_COMPARE did not produce a result"')
  !else:
  !    delta_mm = float(offset["delta"])
  !    delta_um = delta_mm * 1000.0
  !    if abs(delta_um) > 100.0:
  !        emit('RESPOND TYPE=error MSG="WIPE_NOZZLE: contact-vs-proximity delta %.0f um is large — nozzle likely still contaminated"' % delta_um)
  !    else:
  !        emit('RESPOND MSG="WIPE_NOZZLE: contact-vs-proximity delta %.0f um — clean"' % delta_um)
  !emit(f"G0 Z5 F{z_speed}")
  !emit("RESTORE_GCODE_STATE NAME=STATE_WIPE_NOZZLE MOVE=0")
