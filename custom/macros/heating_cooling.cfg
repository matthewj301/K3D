# =====================
# PREHEAT
# =====================
[gcode_macro PREHEAT]
description: Preheat bed/hotend, manage chamber fans based on material
gcode:
  !vars = printer["gcode_macro _PRINTER_VARS"]
  !bed_temp = float(params.get("BED_TEMP", 0))
  !extruder_temp = float(params.get("HOTEND_TEMP", vars["default_chamber_assist_extruder_temp"]))
  !chamber_target_temp = float(params.get("TARGET_CHAMBER_TEMP", 0))
  !material = params.get("MATERIAL", vars["default_material"])
  !quick = int(params.get("QUICK", 0))
  !if "MATERIAL" not in params:
  !  emit(f'RESPOND TYPE=error MSG="PREHEAT recommends passing in MATERIAL. Falling back to stored material - {material}."')
  !assist = bed_temp >= float(vars["chamber_assist_temp"])
  !high_temp_materials = str(vars["high_temp_materials"]).split(",")
  !use_dynamic_heating = (material in high_temp_materials or bed_temp >= float(vars["high_temp_threshold"])) and quick != 1
  !emit(f'RESPOND MSG="PREHEAT: bed_temp:{bed_temp}C Hotend:{extruder_temp}C Material:{material}"')
  !emit(f"M140 S{bed_temp}")
  !if extruder_temp > 0:
  !  emit(f"M104 S{extruder_temp}")
  !if use_dynamic_heating:
  !  emit(f"TA_CHAMBER_HEAT TARGET_CHAMBER_TEMP={chamber_target_temp} BED_TEMP={bed_temp} EXTRUDER_TEMP={extruder_temp}")
  !elif assist:
  !  emit("CHAMBER_FANS_ON")
  !else:
  !  emit("ALL_CHAMBER_FANS_OFF")
  !if quick == 0:
  !  if bed_temp > 0:
  !    emit(f"M190 S{bed_temp}")
  !  if extruder_temp > 0:
  !    emit(f"M109 S{extruder_temp}")
  !warp_list = str(vars["warp_prone_materials"]).split(",")
  !is_warp_prone = material in warp_list or bed_temp >= float(vars["high_temp_threshold"])
  !mins = int(vars["high_temp_heat_soak_time"] if is_warp_prone else vars["standard_heat_soak_time"])
  !if quick == 0 and mins > 0:
  !  emit(f'RESPOND MSG="Heat soak: {mins} minutes"')
  !  emit(f"G4 P{mins * 60 * 1000}")
  !emit('RESPOND MSG="PREHEAT complete."')

