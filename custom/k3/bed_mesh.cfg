[bed_mesh]
mesh_min: 30,30
mesh_max: 140,140
# Anchor the mesh's Z=0 to the same XY where Beacon contact homing sets Z=0
# (see custom/probes/beacon.cfg → home_xy_position: 90,90).
# Without this, the mesh's internal Z reference is the proximity reading at
# whichever mesh point is closest to bed center — which drifts vs. the
# contact-homed Z=0 with temperature/interference. Per Kalico Bed_Mesh docs:
#   "If the coordinate lies within the mesh then the mesh will be offset so
#    the reference position applies zero adjustment."
zero_reference_position: 90, 90